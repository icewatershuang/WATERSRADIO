plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.waters.radio'
    compileSdk 34

    defaultConfig {
        /* v7.0 起独立安装：applicationId 与 v6x（com.waters.radio）不同 → 两个 App 可并存，
           互不覆盖、互不顶替。namespace 仍为 com.waters.radio（R 类 / JsBridge 全兼容）。 */
        applicationId "com.waters.radio.v7"
        /* minSdk 14 = Android 4.0（满足「装得上」）。
           ⚠️ 4.0~4.3 的系统 WebView 跑不动现代网页（无 HLS / CSS Grid），
           装上会白屏；实际可用的最低版本是 Android 5.0（API 21）。
           MediaSession / MediaStyle 通知都是 API 21+，代码里运行时判断，
           API 14-20 只有实体键 onKeyDown 兜底。 */
        minSdk 14
        targetSdk 34
        versionCode 22
        versionName "8.0.4"
        /* v8.0：sherpa-onnx AAR 含 arm64-v8a / armeabi-v7a / x86 / x86_64 四 ABI 的 .so。
           只留真机两 ABI，砍掉 x86(-64) 省约 20MB（APK <100MB 红线）。 */
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        /* v8.0：模型文件 assets/asr/*.onnx（encoder 68MB）必须不压缩——
           否则 AssetManager.openFd() 取不到 fd，原生加载与存在性校验都会失败。 */
        androidResources {
            noCompress 'onnx'
        }
    }

    signingConfigs {
        /* 临时签名（可先装上玩）；生产请换成自己的 keystore，见 BUILD.md。
           keystore 文件不存在时不挂签名配置，仍可出 debug APK。 */
        if (file("waters-release.keystore").exists()) {
            release {
                storeFile file("waters-release.keystore")
                storePassword "waters2026"
                keyAlias "waters-radio"
                keyPassword "waters2026"
                /* v1：Android 7.0 以下必须；v2/v3：Android 7.0/9.0+ 快速校验 */
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (file("waters-release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* v7.0~v7.9：Vosk；v8.0 起替换为 sherpa-onnx 流式 Zipformer（更快更准）。
       AAR 由 CI 下载到 app/libs/（见 build-apk.yml），不在仓库内。
       v8.0.2：sherpa-onnx AAR 的类是 Kotlin 编译的，运行时需要 kotlin-stdlib
       （91 个类调用 Intrinsics.checkNotNullParameter 等）。⚠️ fileTree 引 AAR 不会
       解析 pom 传递依赖，纯 Java 工程也没有 Kotlin 插件自动注入 → v8.0/v8.0.1 真机
       开字幕即抛 NoClassDefFoundError: kotlin.jvm.internal.Intrinsics。显式补上。 */
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
