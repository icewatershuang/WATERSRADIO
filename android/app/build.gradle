plugins {
    id 'com.android.application'
}

android {
    namespace 'com.waters.radio'
    compileSdk 34

    defaultConfig {
        applicationId "com.waters.radio"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 无需第三方依赖：直接用系统 WebView 加载本地 HTML
}
