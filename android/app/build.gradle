plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.waters.radio'
    compileSdk 34

    defaultConfig {
        /* v7.0 起独立安装：applicationId 与 v6x（com.waters.radio）不同 → 两个 App 可并存，
           互不覆盖、互不顶替。namespace 仍为 com.waters.radio（R 类 / JsBridge 全兼容）。 */
        applicationId "com.waters.radio.v7"
        /* minSdk 14 = Android 4.0（满足「装得上」）。
           ⚠️ 4.0~4.3 的系统 WebView 跑不动现代网页（无 HLS / CSS Grid），
           装上会白屏；实际可用的最低版本是 Android 5.0（API 21）。
           MediaSession / MediaStyle 通知都是 API 21+，代码里运行时判断，
           API 14-20 只有实体键 onKeyDown 兜底。 */
        minSdk 14
        targetSdk 34
        versionCode 16
        versionName "7.8"
    }

    /* v7.2：语音模型 zip（assets/vosk/*.zip，共约 80MB）本身已是压缩格式，
       AAPT2 不必再 deflate（白耗时、零收益）；assets 读取按原样流式解压 */
    androidResources {
        noCompress 'zip'
    }

    signingConfigs {
        /* 临时签名（可先装上玩）；生产请换成自己的 keystore，见 BUILD.md。
           keystore 文件不存在时不挂签名配置，仍可出 debug APK。 */
        if (file("waters-release.keystore").exists()) {
            release {
                storeFile file("waters-release.keystore")
                storePassword "waters2026"
                keyAlias "waters-radio"
                keyPassword "waters2026"
                /* v1：Android 7.0 以下必须；v2/v3：Android 7.0/9.0+ 快速校验 */
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (file("waters-release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* v7.0：离线语音识别（Vosk）。纯 NDK + 轻量 Java 包装，不引入 AndroidX。
       v7.2：模型 zip（英/中小模型）已内置 APK assets/vosk/，开箱即用、不联网。 */
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
