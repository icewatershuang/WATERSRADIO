name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 注意：不要用 android-actions/setup-android —— 它会安装已废弃的 tools 包导致失败。
      # GitHub runner 镜像自带 Android SDK，直接用即可。
      - name: Prepare Android SDK
        run: |
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5 || true
          sdkmanager --list_installed | head -20

      - name: Sync web assets into Android assets
        # v7.0 起 APP 网页源是 app-web/（v7.0 冻结版，含字幕功能），
        # 与公开网页（仓库根 index.html，冻结在 v62）彻底解耦——
        # 根目录以后任何改动都不再进 APK。
        run: |
          mkdir -p android/app/src/main/assets
          cp app-web/index.html app-web/hls.min.js app-web/version.txt android/app/src/main/assets/

      # v7.2：语音模型随 APK 内置（assets/vosk/*.zip）。装上即有、开字幕不联网。
      # CI 下载 zip 只需几秒；用 cache 缓存避免每次构建重复下载。
      # v7.8：只内置英文小模型（精简包）—— 中文 zip 移除（APK ~100MB→~56MB）；
      # 基准实测 0.22-lgraph 手机上 RTF>1 会积压毁同步，small-0.15 即流式最优解。
      # 恢复中文：把 vosk-model-small-cn-0.22.zip 加回 for 列表并更新 cache key。
      - name: Cache Vosk models
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/vosk
          key: vosk-models-small-en-us-0.15-only-v78

      - name: Bundle Vosk speech models (built-in, no download at runtime)
        run: |
          mkdir -p android/app/src/main/assets/vosk
          cd android/app/src/main/assets/vosk
          rm -f vosk-model-small-cn-0.22.zip   # v7.8：cache 里可能残留旧中文包，强制清除
          for f in vosk-model-small-en-us-0.15.zip; do
            if [ ! -s "$f" ]; then
              echo "Downloading $f ..."
              curl -fL --retry 5 --retry-delay 5 -o "$f" "https://alphacephei.com/vosk/models/$f"
            else
              echo "Cached: $f ($(stat -c%s "$f") bytes)"
            fi
          done
          ls -la
          # 完整性粗检：内置模型应 >30MB
          for f in *.zip; do
            s=$(stat -c%s "$f")
            if [ "$s" -lt 30000000 ]; then echo "MODEL TOO SMALL: $f ($s bytes)"; exit 1; fi
          done
          # v7.8：精简包断言 —— 不应存在中文模型
          if [ -s vosk-model-small-cn-0.22.zip ]; then echo "CN MODEL SHOULD BE REMOVED"; exit 1; fi

      - name: Build Debug APK (auto-signed)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.9
          arguments: :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waters-radio-apk
          path: android/app/build/outputs/apk/debug/*.apk
