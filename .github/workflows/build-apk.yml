name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 注意：不要用 android-actions/setup-android —— 它会安装已废弃的 tools 包导致失败。
      # GitHub runner 镜像自带 Android SDK，直接用即可。
      - name: Prepare Android SDK
        run: |
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5 || true
          sdkmanager --list_installed | head -20

      - name: Sync web assets into Android assets
        # v7.0 起 APP 网页源是 app-web/（v7.0 冻结版，含字幕功能），
        # 与公开网页（仓库根 index.html，冻结在 v62）彻底解耦——
        # 根目录以后任何改动都不再进 APK。
        run: |
          mkdir -p android/app/src/main/assets
          cp app-web/index.html app-web/hls.min.js app-web/version.txt android/app/src/main/assets/

      # v8.0：sherpa-onnx AAR（含 arm64/armeabi 原生库）→ app/libs/，由 build.gradle
      # 以 fileTree 引入。AAR 不在仓库内，CI 下载（约 50MB）。
      - name: Fetch sherpa-onnx AAR
        run: |
          mkdir -p android/app/libs
          AAR=android/app/libs/sherpa-onnx-1.13.8.aar
          if [ ! -s "$AAR" ]; then
            echo "Downloading sherpa-onnx AAR ..."
            curl -fL --retry 5 --retry-delay 5 -o "$AAR" \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          else
            echo "Existing AAR: $(stat -c%s "$AAR") bytes"
          fi
          s=$(stat -c%s "$AAR")
          if [ "$s" -lt 40000000 ]; then echo "AAR TOO SMALL ($s)"; exit 1; fi
          ls -la android/app/libs

      # v8.0.1 修复：sherpa AAR 内置 libonnxruntime.so 的 ELF .note.android min SDK = 27，
      # Android < 8.1（API 27）设备加载该库会被 linker 拒绝
      #（"has min SDK version 27 but the device is XX"）→ 字幕初始化失败。
      # 该库实际仅依赖 API 1/23 级 libc 符号，把注记降到 21（与同包 sherpa 库及 app
      # minSdk 对齐）即可在 API 21+ 正常加载。
      - name: Patch onnxruntime min SDK (27 -> 21)
        run: python3 _tools/patch_onnx_minapi.py android/app/libs/sherpa-onnx-1.13.8.aar

      # v8.0：流式 Zipformer 英文模型（int8）随 APK 内置 assets/asr/，开字幕不联网。
      # 仅首次（cache 命中则跳过）下载 tar 并抽出 4 个文件。cache key 含模型名+版本。
      - name: Cache sherpa asr model
        uses: actions/cache@v4
        with:
          path: android/app/src/main/assets/asr
          key: sherpa-zipformer-en-int8-streaming-2023-06-26-v80

      - name: Bundle sherpa asr model (built-in, no download at runtime)
        run: |
          mkdir -p android/app/src/main/assets/asr
          cd android/app/src/main/assets/asr
          ENC="encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx"
          DEC="decoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx"
          JOIN="joiner-epoch-99-avg-1-chunk-16-left-128.int8.onnx"
          if [ ! -s "$ENC" ] || [ ! -s tokens.txt ]; then
            TAR="sherpa-onnx-streaming-zipformer-en-2023-06-26.tar.bz2"
            BASE="https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models"
            echo "Downloading $TAR ..."
            curl -fL --retry 5 --retry-delay 5 -o "$TAR" "$BASE/$TAR"
            P=sherpa-onnx-streaming-zipformer-en-2023-06-26
            tar xjf "$TAR" --strip-components=1 \
              "$P/$ENC" "$P/$DEC" "$P/$JOIN" "$P/tokens.txt"
            rm -f "$TAR"
          else
            echo "Cached model files present"
          fi
          ls -la
          if [ "$(stat -c%s "$ENC")" -lt 60000000 ]; then echo "ENCODER TOO SMALL"; exit 1; fi
          if [ "$(stat -c%s tokens.txt)" -lt 1000 ]; then echo "TOKENS TOO SMALL"; exit 1; fi

      - name: Build Debug APK (auto-signed)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.9
          arguments: :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waters-radio-apk
          path: android/app/build/outputs/apk/debug/*.apk
