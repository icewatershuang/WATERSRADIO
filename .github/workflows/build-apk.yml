name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 注意：不要用 android-actions/setup-android —— 它会安装已废弃的 tools 包导致失败。
      # GitHub runner 镜像自带 Android SDK，直接用即可。
      - name: Prepare Android SDK
        run: |
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5 || true
          sdkmanager --list_installed | head -20

      - name: Sync web assets into Android assets
        # v7.0 起 APP 网页源是 app-web/（v7.0 冻结版，含字幕功能），
        # 与公开网页（仓库根 index.html，冻结在 v62）彻底解耦——
        # 根目录以后任何改动都不再进 APK。
        run: |
          mkdir -p android/app/src/main/assets
          cp app-web/index.html app-web/hls.min.js app-web/version.txt android/app/src/main/assets/

      - name: Build Debug APK (auto-signed)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.9
          arguments: :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waters-radio-apk
          path: android/app/build/outputs/apk/debug/*.apk
